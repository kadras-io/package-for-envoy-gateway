apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eg-gateway-helm-certgen:envoy-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eg-gateway-helm-certgen:envoy-gateway-system
