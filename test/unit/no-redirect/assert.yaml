apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  (listeners[*].name): [http, https]
  (listeners[0].allowedRoutes.namespaces.from): All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  tls:
    minVersion: "1.2"
