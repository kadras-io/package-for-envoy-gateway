apiVersion: cert-manager.io/v1
kind: Certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
---
# With a single replica, no PodDisruptionBudget for Envoy Gateway.
apiVersion: policy/v1
kind: PodDisruptionBudget
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
spec:
  telemetry:
    (contains(keys(@), 'tracing')): true
---
# Without HTTPS listeners, there are no TLS settings to apply.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
---
# The Gateway API CRDs and the `safe-upgrades` admission policy are installed by the Gateway API package.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutes.gateway.networking.k8s.io
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xbackendtrafficpolicies.gateway.networking.x-k8s.io
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
