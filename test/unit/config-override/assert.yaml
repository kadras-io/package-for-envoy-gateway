apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
data:
  (parse_yaml("envoy-gateway.yaml")):
    extensionApis:
      enableBackend: true
    logging:
      level:
        default: info
---
# envoy.config is merged on top of the computed configuration.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 100m
        (starts_with(container.image, 'docker.io/envoyproxy/envoy:')): true
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        annotations:
          load-balancer.hetzner.cloud/location: nbg1
      (contains(keys(@), 'envoyPDB')): false
  shutdown:
    drainTimeout: 90s
---
# The internal Gateway is always exposed via a ClusterIP Service, without the external Service settings.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: envoy-gateway-system
spec:
  provider:
    kubernetes:
      envoyService:
        type: ClusterIP
        (contains(keys(@), 'annotations')): false
        (contains(keys(@), 'externalTrafficPolicy')): false
---
# The PROXY protocol is enabled even without HTTPS listeners, which have no TLS settings to apply.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - kind: Gateway
    name: external
  proxyProtocol: {}
  (contains(keys(@), 'tls')): false
