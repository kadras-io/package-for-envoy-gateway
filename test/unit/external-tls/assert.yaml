# HTTP only serves the redirect, HTTPS is served for the domain and each hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  (listeners[*].name): [http-redirect, https, https-wildcard-team-a-kadras-io, https-www-example-org]
  (listeners[*].allowedRoutes.namespaces.from): [Same, Same, Same, Same]
  (listeners[?name == 'http-redirect'] | [0]):
    port: 80
    protocol: HTTP
  (listeners[?name == 'https'] | [0]):
    port: 443
    protocol: HTTPS
    hostname: '*.kadras.io'
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: external-tls
  (listeners[?name == 'https-wildcard-team-a-kadras-io'] | [0]):
    hostname: '*.team-a.kadras.io'
    tls:
      certificateRefs:
      - name: external-wildcard-team-a-kadras-io-tls
  (listeners[?name == 'https-www-example-org'] | [0]):
    hostname: www.example.org
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-tls
  namespace: envoy-gateway-system
spec:
  secretName: external-tls
  dnsNames: ['*.kadras.io']
  issuerRef:
    name: kadras-ca-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-wildcard-team-a-kadras-io-tls
  namespace: envoy-gateway-system
spec:
  dnsNames: ['*.team-a.kadras.io']
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-www-example-org-tls
  namespace: envoy-gateway-system
spec:
  dnsNames: [www.example.org]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: external
    sectionName: http-redirect
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# HTTPS listeners only accept TLS 1.3 by default.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
  tls:
    minVersion: "1.3"
