---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: tests
spec:
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: ghcr.io/knative/helloworld-go:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: tests
spec:
  selector:
    app: hello
  ports:
  - port: 80
    targetPort: 8080
---
# Exposed outside the cluster. With TLS, served over HTTPS by the `*.tests.<domain>` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-external
  namespace: tests
spec:
  parentRefs:
  - name: external
    namespace: envoy-gateway-system
  hostnames:
  - hello.tests.127.0.0.1.sslip.io
  rules:
  - backendRefs:
    - name: hello
      port: 80
---
# Exposed within the cluster only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-internal
  namespace: tests
spec:
  parentRefs:
  - name: internal
    namespace: envoy-gateway-system
  hostnames:
  - hello.tests.svc.cluster.local
  rules:
  - backendRefs:
    - name: hello
      port: 80
---
# A client to send requests from inside the cluster (see test/setup/scripts/probe.sh).
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: tests
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["sleep", "infinity"]
