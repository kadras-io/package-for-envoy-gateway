#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/envoy_gateway.star", "image_pull_secret_name")

#! This Secret will be populated by secretgen-controller with the credentials to authenticate
#! with the container registry from where to pull the images to deploy (if authentication is required).
#! Such credentials should grant read-only access to the private container registry.
#! Use cases: private registries or air-gapped scenarios.
#! The Envoy proxies run in the same namespace and reference it via their EnvoyProxy resources (see gateways.yml).

---
apiVersion: v1
kind: Secret
metadata:
  name: #@ image_pull_secret_name
  namespace: #@ data.values.namespace
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K

#@ deployment = overlay.subset({"kind":"Deployment"})
#@ job = overlay.subset({"kind":"Job"})

#@overlay/match by=overlay.or_op(deployment, job), expects="1+"
---
spec:
  template:
    spec:
      #@overlay/match missing_ok=True
      imagePullSecrets:
        - name: #@ image_pull_secret_name
