#@schema/desc "The namespace in which to deploy Envoy Gateway. The Envoy proxies of the Gateways run in the same namespace."
#@schema/validation ("a valid DNS label", is_dns_label)
namespace: envoy-gateway-system

#! =============================================
#! Gateways
#! =============================================

#@schema/desc "The Gateways served by Envoy Gateway through the `envoy` GatewayClass, each with its own Envoy proxies. See https://gateway.envoyproxy.io/docs/concepts."
gateways:
  #@schema/desc "The Gateway exposing applications outside the cluster, through the Envoy Service. TLS is terminated on the Gateway, with certificates issued by cert-manager."
  external:
    #@schema/desc "Whether to create the external Gateway."
    enabled: true
    #@schema/desc "The name of the Gateway, created in the package namespace. Its Envoy Service is named `envoy-<name>`."
    #@schema/validation ("a valid DNS label", is_dns_label)
    name: external
    #@schema/desc "The namespaces from which routes can attach to the Gateway. `All` allows any namespace, `Same` only the package namespace."
    #@schema/validation one_of=["All", "Same"]
    allowed_routes: All
    #@schema/desc "The domain served over HTTPS by the Gateway via a wildcard certificate (`*.<domain>`). It requires `tls.issuer`."
    #@schema/examples ("Custom domain", "example.com"), ("Local development with sslip.io", "127.0.0.1.sslip.io")
    #@schema/validation ("a valid DNS name", lambda v: v == "" or is_dns_name(v))
    domain: ""
    #@schema/desc "Settings for the HTTPS listeners of the Gateway."
    tls:
      #@schema/desc "The name of the cert-manager ClusterIssuer that issues the certificates for `domain` and `hostnames`. For ACME issuers, wildcard certificates require a DNS-01 challenge."
      #@schema/examples ("Kadras private CA", "kadras-ca-issuer")
      issuer: ""
      #@schema/desc "The minimum TLS version accepted by the HTTPS listeners."
      #@schema/validation one_of=["1.2", "1.3"]
      min_version: "1.3"
      #@schema/desc "Whether to redirect all HTTP requests to HTTPS. Only applied when `issuer` is set: the HTTP listener then only serves the redirect, and the ACME HTTP-01 challenges of cert-manager."
      http_redirect: true
      #@schema/desc "Additional hostnames served over HTTPS, each with its own listener and certificate. Use a wildcard like `*.team-a.example.com` to serve the applications of a namespace with Knative Serving."
      #@schema/examples ("Knative namespace", ["*.team-a.example.com"])
      #@schema/validation ("unique hostnames", lambda hostnames: len(hostnames) == len({h: None for h in hostnames}))
      hostnames:
      #@schema/validation ("a valid hostname, optionally prefixed with `*.`", is_listener_hostname)
      - ""
  #@schema/desc "The Gateway serving traffic within the cluster over HTTP, through a ClusterIP Service. For example, Knative Serving uses it for cluster-local traffic, which isn't exposed by the external Gateway."
  internal:
    #@schema/desc "Whether to create the internal Gateway."
    enabled: true
    #@schema/desc "The name of the Gateway, created in the package namespace. Its Envoy Service is named `envoy-<name>`. Routes can attach to it from any namespace."
    #@schema/validation ("a valid DNS label", is_dns_label)
    name: internal


#! =============================================
#! Components
#! =============================================

#@schema/desc "Settings for Envoy Gateway, the control plane."
controller:
  #@schema/desc "The number of replicas. Additional replicas are standby via leader election. With more than 1 replica, a PodDisruptionBudget is created."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "Envoy Gateway configuration, merged on top of the one computed by the package. See https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway."
  #@schema/examples ("Enable the Backend API", {"extensionApis": {"enableBackend": True}})
  #@schema/type any=True
  config: {}

#@schema/desc "Settings for the Envoy proxies, the data plane, applied to every Gateway."
envoy:
  #@schema/desc "The number of Envoy replicas for each Gateway. With more than 1 replica, a PodDisruptionBudget is created."
  #@schema/validation min=1
  replicas: 1
  #@schema/desc "How long Envoy drains the open connections before terminating, as a duration."
  #@schema/validation ("a duration, like `60s`", is_duration)
  drain_timeout: 60s
  #@schema/desc "Settings for the Service exposing the Envoy proxies of the external Gateway. The internal Gateway always uses a ClusterIP Service."
  service:
    #@schema/desc "The type of the Service."
    #@schema/validation one_of=["LoadBalancer", "NodePort", "ClusterIP"]
    type: LoadBalancer
    #@schema/desc "The external traffic policy of the Service, when `type` is `LoadBalancer` or `NodePort`. `Local` preserves the client source IP."
    #@schema/validation one_of=["Cluster", "Local"]
    external_traffic_policy: Local
    #@schema/desc "Annotations for the Service, for example to configure the load balancer implementation."
    #@schema/type any=True
    annotations: {}
    #@schema/desc "Whether the load balancer in front of the Service sends the PROXY protocol, to preserve the client source IP. Envoy then rejects the connections without it. Enable it together with the load balancer setting, like the `load-balancer.hetzner.cloud/uses-proxyprotocol` annotation on Hetzner."
    proxy_protocol: false
  #@schema/desc "EnvoyProxy configuration, merged on top of the one computed by the package for every Gateway. See https://gateway.envoyproxy.io/docs/api/extension_types/#envoyproxyspec."
  #@schema/examples ("Resources", {"provider": {"kubernetes": {"envoyDeployment": {"container": {"resources": {"requests": {"cpu": "100m", "memory": "256Mi"}}}}}}})
  #@schema/type any=True
  config: {}

#! =============================================
#! TLS
#! =============================================

#@schema/desc "Settings for TLS."
tls:
  #@schema/desc "The certificates securing the connections between Envoy Gateway and the Envoy proxies (xDS), and the Envoy Gateway webhook."
  internal:
    #@schema/desc "How the certificates are provisioned. `certgen` generates them with a Job at installation, and doesn't renew them. `cert-manager` issues and renews them via cert-manager, which must be installed in the cluster."
    #@schema/validation one_of=["certgen", "cert-manager"]
    provider: certgen
    #@schema/desc "How long the certificates are valid, in hours. Only for the `cert-manager` provider."
    #@schema/validation ("a number of hours, like `8760h`", is_hours)
    duration: 8760h
    #@schema/desc "How long before expiry the certificates are renewed, in hours. Only for the `cert-manager` provider."
    #@schema/validation ("a number of hours, like `360h`", is_hours)
    renew_before: 360h

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs, metrics, and traces."
observability:
  logging:
    #@schema/desc "The log level for Envoy Gateway and the Envoy proxies."
    #@schema/validation one_of=["debug", "info", "warn", "error"]
    level: info
  metrics:
    #@schema/desc "Whether to produce metrics."
    enabled: true
    #@schema/desc "How the metrics are exported. With `prometheus`, Envoy Gateway and the Envoy proxies expose them on port 19001, and their Pods are annotated for scraping. With `otlp`, they push them via OTLP/gRPC to `endpoint`."
    #@schema/validation one_of=["prometheus", "otlp"]
    exporter: prometheus
    #@schema/desc "The OTLP/gRPC endpoint of an in-cluster OpenTelemetry collector, in the form `[http://]<service>.<namespace>[.svc[.cluster.local]]:<port>`. Required with the `otlp` exporter."
    #@schema/examples ("OpenTelemetry collector", "http://otel-collector.observability.svc:4317")
    #@schema/validation ("an in-cluster OTLP/gRPC endpoint like `http://<service>.<namespace>.svc:4317`", is_in_cluster_otlp_endpoint), when=lambda _, ctx: otlp_enabled(ctx.parent)
    endpoint: ""
  tracing:
    #@schema/desc "Whether to export the traces of the requests handled by the Envoy proxies via OTLP/gRPC."
    enabled: false
    #@schema/desc "The OTLP/gRPC endpoint of an in-cluster OpenTelemetry collector, in the form `[http://]<service>.<namespace>[.svc[.cluster.local]]:<port>`."
    #@schema/examples ("OpenTelemetry collector", "http://otel-collector.observability.svc:4317")
    #@schema/validation ("an in-cluster OTLP/gRPC endpoint like `http://<service>.<namespace>.svc:4317`", is_in_cluster_otlp_endpoint), when=lambda _, ctx: ctx.parent["enabled"]
    endpoint: ""
    #@schema/desc "The fraction of requests to trace, from 0 (never) to 1 (always)."
    #@schema/validation min=0.0, max=1.0
    sampling_rate: 1.0
