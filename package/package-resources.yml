apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: envoy-gateway.packages.kadras.io.0.0.0
spec:
  licenses:
  - Apache 2.0
  refName: envoy-gateway.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/package-for-envoy-gateway/releases
  releasedAt: null
  template:
    spec:
      deploy:
      - kapp:
          rawOptions:
          - --wait-timeout=5m
          - --kube-api-qps=25
          - --kube-api-burst=50
      fetch:
      - git: {}
      template:
      - ytt:
          paths:
          - config
      - kbld: {}
  valuesSchema:
    openAPIv3: {}
  version: 0.0.0

---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: PackageMetadata
metadata:
  name: envoy-gateway.packages.kadras.io
spec:
  categories:
  - ingress
  - envoy
  - gateway
  displayName: envoy-gateway
  longDescription: Envoy Gateway manages Envoy proxies as standalone or Kubernetes-based
    application gateways, configured via the Kubernetes Gateway API. It provides HTTPS
    termination, traffic management, and security policies for the applications running
    on the cluster.
  maintainers:
  - name: Thomas Vitale
  providerName: Kadras
  shortDescription: Application gateway based on Envoy and the Kubernetes Gateway API.
  supportDescription: Go to https://kadras.io for documentation and https://github.com/kadras-io/package-for-envoy-gateway
    for community support.

---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  annotations:
    kctrl.carvel.dev/local-fetch-0: .
  name: envoy-gateway
spec:
  packageRef:
    refName: envoy-gateway.packages.kadras.io
    versionSelection:
      constraints: 0.0.0
  serviceAccountName: kadras-install-sa
status:
  conditions: null
  friendlyDescription: ""
  observedGeneration: 0
